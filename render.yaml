# Render Blueprint for DevSyncPro - Trigger Deploy v2.4
services:
  # Backend Services
  - type: web
    name: dsp-scanner
    env: docker
    plan: free
    dockerfilePath: backend/repo-scanner/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_SCAN
        value: scan-events

  - type: web
    name: dsp-orchestrator
    env: docker
    plan: free
    dockerfilePath: backend/orchestrator/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_OPERATIONS
        value: operation-events
      - key: RELAY_URL
        fromService:
          name: devsyncpro-relay
          type: web
          property: url

  - type: web
    name: dsp-analyzer
    env: docker
    plan: free
    dockerfilePath: backend/ai-analyzer/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

  - type: web
    name: dsp-relay
    env: docker
    plan: free
    dockerfilePath: websocket-server/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: devsyncpro-ui-static
    runtime: static
    rootDir: frontend/devsyncpro-ui
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_ORCHESTRATOR_API
        fromService:
          name: dsp-orchestrator
          type: web
          property: url
      - key: REACT_APP_SCANNER_API
        fromService:
          name: dsp-scanner
          type: web
          property: url
      - key: REACT_APP_ANALYZER_API
        fromService:
          name: dsp-analyzer
          type: web
          property: url
      - key: REACT_APP_WS_URL
        fromService:
          name: dsp-relay
          type: web
          property: url










