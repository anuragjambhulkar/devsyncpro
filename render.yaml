# Render Blueprint for DevSyncPro - Trigger Deploy v5.0 (CLEAN SLATE)
services:
  # Backend Services
  - type: web
    name: dsp-v5-core
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/core-api/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_SCAN
        value: scan-events
      - key: PUBSUB_TOPIC_OPERATIONS
        value: operation-events
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false

  # Frontend Static Site
  - type: web
    name: dsp-v5-ui
    runtime: static
    rootDir: frontend/devsyncpro-ui
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_ORCHESTRATOR_API
        value: "" 
      - key: REACT_APP_SCANNER_API
        value: "" 
      - key: REACT_APP_ANALYZER_API
        value: "" 
      - key: REACT_APP_WS_URL
        value: "" 
