# Render Blueprint for DevSyncPro - Trigger Deploy v4.6 (PROD SYNC)
services:
  # Backend Services
  - type: web
    name: dsp-prod-scanner
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/repo-scanner/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SERVICE_TYPE
        value: scanner
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_SCAN
        value: scan-events

  - type: web
    name: dsp-prod-orchestrator
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/orchestrator/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SERVICE_TYPE
        value: orchestrator
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_OPERATIONS
        value: operation-events
      - key: RELAY_URL
        fromService:
          name: dsp-prod-relay
          type: web
          property: host

  - type: web
    name: dsp-prod-analyzer
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/ai-analyzer/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

  - type: web
    name: dsp-prod-relay
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: websocket-server/Dockerfile
    envVars:
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: dsp-prod-ui
    runtime: static
    rootDir: frontend/devsyncpro-ui
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_ORCHESTRATOR_API
        value: "" # Handled by config.ts discovery fallback
      - key: REACT_APP_SCANNER_API
        value: "" # Handled by config.ts discovery fallback
      - key: REACT_APP_ANALYZER_API
        value: "" # Handled by config.ts discovery fallback
      - key: REACT_APP_WS_URL
        value: "" # Handled by config.ts discovery fallback
