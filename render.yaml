# Render Blueprint for DevSyncPro - Trigger Deploy v4.0
services:
  # Backend Services
  - type: web
    name: devsyncpro-3
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SERVICE_TYPE
        value: scanner
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_SCAN
        value: scan-events

  - type: web
    name: devsyncpro-1
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: SERVICE_TYPE
        value: orchestrator
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_OPERATIONS
        value: operation-events
      - key: RELAY_URL
        fromService:
          name: dsp-relay
          type: web
          property: host

  - type: web
    name: devsyncpro-2
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/ai-analyzer/Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

  - type: web
    name: dsp-relay
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: websocket-server/Dockerfile
    envVars:
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: devsyncpro-ui-static
    runtime: static
    rootDir: frontend/devsyncpro-ui
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_ORCHESTRATOR_API
        fromService:
          name: devsyncpro-1
          type: web
          property: host
      - key: REACT_APP_SCANNER_API
        fromService:
          name: devsyncpro-3
          type: web
          property: host
      - key: REACT_APP_ANALYZER_API
        fromService:
          name: devsyncpro-2
          type: web
          property: host
      - key: REACT_APP_WS_URL
        fromService:
          name: dsp-relay
          type: web
          property: host










