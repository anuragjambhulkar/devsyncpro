services:
  # Backend Services
  - type: web
    name: scanner
    runtime: docker
    plan: free
    dockerFilePath: backend/repo-scanner/Dockerfile
    envVars:
      - key: PORT
        value: 8081
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_SCAN
        value: scan-events

  - type: web
    name: orchestrator
    runtime: docker
    plan: free
    dockerFilePath: backend/orchestrator/Dockerfile
    envVars:
      - key: PORT
        value: 8082
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: PUBSUB_TOPIC_OPERATIONS
        value: operation-events
      - key: RELAY_URL
        fromService:
          name: relay
          type: web
          property: url

  - type: web
    name: analyzer
    runtime: docker
    plan: free
    dockerFilePath: backend/ai-analyzer/Dockerfile
    envVars:
      - key: PORT
        value: 8083
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

  - type: web
    name: relay
    runtime: docker
    plan: free
    dockerFilePath: websocket-server/Dockerfile
    envVars:
      - key: PORT
        value: 9000

  # Frontend Static Site
  - type: web
    name: ui
    runtime: static
    rootDir: frontend/devsyncpro-ui
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_ORCHESTRATOR_API
        fromService:
          name: orchestrator
          type: web
          property: url
      - key: REACT_APP_SCANNER_API
        fromService:
          name: scanner
          type: web
          property: url
      - key: REACT_APP_ANALYZER_API
        fromService:
          name: analyzer
          type: web
          property: url
      - key: REACT_APP_WS_URL
        fromService:
          name: relay
          type: web
          property: url



