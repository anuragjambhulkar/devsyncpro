apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-service
  labels:
    app: contract-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contract-service
  template:
    metadata:
      labels:
        app: contract-service
    spec:
      containers:
      - name: contract-service
        image: gcr.io/${GOOGLE_CLOUD_PROJECT}/contract-service:latest
        ports:
        - containerPort: 8084
        env:
        - name: PORT
          value: "8084"
        # Hybrid DB Configuration (Inject Secret in Prod)
        # - name: DB_HOST
        #   valueFrom:
        #     secretKeyRef:
        #       name: db-credentials
        #       key: host
---
apiVersion: v1
kind: Service
metadata:
  name: contract-service
spec:
  selector:
    app: contract-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8084
  type: LoadBalancer
